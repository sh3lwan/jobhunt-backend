# VPS deployment (push-to-deploy): API-only jobhunter at jobhive-api.sh3lwan.dev.
# DISABLE_BACKGROUND=true — the Mac stays the pipeline driver (rerank/Kafka);
# Postgres lives in the jobscrapper stack (service "db" on jobscrapper_default).
# Local full-stack dev compose is docker-compose.local.yml.
networks:
  traefik-public:
    external: true
  jobscrapper_default:
    external: true

volumes:
  storage:

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DISABLE_BACKGROUND: "true"
    volumes:
      - storage:/app/storage/uploads
    mem_limit: 300m
    networks:
      - traefik-public
      - jobscrapper_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.jobhive-api.rule=Host(`jobhive-api.sh3lwan.dev`)"
      - "traefik.http.routers.jobhive-api.entrypoints=websecure"
      - "traefik.http.routers.jobhive-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.jobhive-api.loadbalancer.server.port=8080"
